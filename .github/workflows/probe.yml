name: probe
on:
  push:
    branches: [feat/monitor]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability
        run: |
          curl -sS -m 20 https://ipinfo.io/json | grep -E '"(country|org)"' || true
          for u in https://icp.administracionelectronica.gob.es/icpplus/index.html https://sede.administracionespublicas.gob.es/ ; do
            curl -sS -o /dev/null -w "$u %{http_code}\n" -m 30 "$u" || echo "$u FAILED"
          done
